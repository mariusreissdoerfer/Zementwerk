<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Zementwerk-Simulator</title>
<link rel="stylesheet" href="style.css?v=16">
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-clock">
      <div id="clock">Tag 1 &middot; 06:00</div>
      <div id="money">5.000.000 &euro;</div>
      <div id="profit" class="profit">&plusmn;0 &euro;/Tag</div>
    </div>
    <div id="kpis" class="hud-kpis"></div>
    <div id="alarm" class="hud-alarm hidden"></div>
  </header>

  <main id="stage">
    <canvas id="flowsheet"></canvas>
  </main>

  <aside id="panel" class="panel hidden"></aside>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <footer id="controls">
    <div id="speed" class="speed"></div>
    <div id="menu" class="menu"></div>
  </footer>

</div>
<script type="module" src="src/main.js?v=16"></script>
</body>
</html>
